    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) {
          audioCtx = new AudioCtxClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const NOTE_FREQS = {
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13,
      'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00,
      'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25
    };

    function playPianoNote(noteName, duration = 1.2) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const freq = NOTE_FREQS[noteName];
        if (!freq) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.35, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.05);
      } catch (e) {
        console.error('Audio error:', e);
      }
    }

    function playChord(notes) {
      notes.forEach((note, idx) => {
        setTimeout(() => playPianoNote(note, 1.6), idx * 25);
      });

                      <span className="text-[10px] font-bold font-mono">{k.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Chord Trigger Buttons */}
          <div className="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-2">
            {PRESET_CHORDS.map((chord) => (
              <button
                key={chord.name}
                type="button"
                onClick={() => handleChordClick(chord)}
                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 active:bg-amber-500 active:text-slate-950 text-slate-200 rounded-lg text-xs font-bold transition-all border border-slate-700 hover:border-amber-400 text-center cursor-pointer"
              >
                {chord.name.split(' ')[0]} {chord.name.split(' ')[1]}
              </button>
            ))}
          </div>
        </div>
      );
    }

    function CurriculumMastery() {
      return (
        <section className="py-16 bg-white border-b border-slate-200">
          <div className="max-w-5xl mx-auto px-4 sm:px-6">
            <div className="text-center max-w-3xl mx-auto mb-10">
              <span className="text-amber-600 font-extrabold text-xs uppercase tracking-widest bg-amber-50 px-3 py-1 rounded-full border border-amber-200">
                8-STEP ZERO TO CHURCH-READY BLUEPRINT
              </span>
              <h2 className="text-2xl sm:text-3xl font-black text-slate-950 mt-3">
                Everything You Will Master in The Novice Foundations Path
              </h2>
              <p className="text-sm text-slate-600 mt-2">
                Designed specifically for adult learners who don't have hours to practice every day.
              </p>
            </div>

            {/* Interactive Piano Preview */}
            <InteractivePianoWidget />

            {/* 8 Lessons Grid */}
            <div className="grid md:grid-cols-2 gap-4 mt-8">
              {CURRICULUM_POINTS.map((item) => (
                <div key={item.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-white hover:shadow-md transition-all flex items-start gap-3.5">
                  <span className="px-2.5 py-1 rounded-md bg-amber-500 text-slate-950 font-black text-xs font-mono shrink-0">
                    {item.badge}
                  </span>
                  <p className="text-xs sm:text-sm font-semibold text-slate-800 leading-snug">
                    {item.title}
                  </p>
                </div>
              ))}
            </div>

            {/* Daniel's Credentials */}
            <div className="mt-12 bg-gradient-to-br from-slate-900 to-slate-950 text-white rounded-2xl p-6 sm:p-8 border border-slate-800 shadow-xl">
              <div className="max-w-3xl">
                <span className="text-amber-400 text-xs font-bold uppercase tracking-wider">Meet Your Instructor</span>
                <h3 className="text-xl sm:text-2xl font-black text-white mt-1">Daniel Ubachi</h3>
                <p className="text-xs sm:text-sm text-slate-300 mt-2 leading-relaxed">
                  Pianist, worship leader, and teacher with over 15 years of Gospel experience and 11 years in Jazz performance.
                </p>

                <div className="grid sm:grid-cols-2 gap-2 mt-5">
                  {DANIEL_CREDENTIALS.map((cred, i) => (
                    <div key={i} className="flex items-center gap-2 text-xs text-slate-300">
                      <span className="text-amber-400 font-bold">✔</span>
                      <span>{cred}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function ValueStackSection({ onSuccess }) {
      const totalValue = VALUE_STACK.reduce((acc, item) => acc + item.value, 0);

      return (
        <section className="py-16 bg-slate-50 border-b border-slate-200">
          <div className="max-w-4xl mx-auto px-4 sm:px-6">
            <div className="text-center mb-10">
              <span className="text-amber-700 font-extrabold text-xs uppercase tracking-widest bg-amber-100 px-3 py-1 rounded-full border border-amber-300">
                COMPLETE VALUE BREAKDOWN
              </span>
              <h2 className="text-2xl sm:text-3xl font-black text-slate-950 mt-3">
                Here is Everything You Get Today for 100% Free
              </h2>
            </div>

            <div className="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden mb-8">
              <div className="p-6 sm:p-8 space-y-4">
                {VALUE_STACK.map((item) => (
                  <div key={item.number} className="flex items-center justify-between border-b border-slate-100 pb-3 last:border-b-0">
                    <div className="flex items-center gap-3">
                      <span className="w-6 h-6 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center font-bold text-xs">
                        {item.number}
                      </span>
                      <span className="font-semibold text-slate-800 text-xs sm:text-sm">{item.title}</span>
                    </div>
                    <span className="font-mono text-slate-400 line-through text-xs sm:text-sm">${item.value} Value</span>
                  </div>
                ))}

                <div className="pt-4 border-t-2 border-slate-200 flex items-center justify-between">
                  <span className="font-extrabold text-slate-900 text-base">Total Value:</span>
                  <span className="font-mono font-bold text-slate-500 line-through text-base">${totalValue}</span>
                </div>

                <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-amber-800 uppercase tracking-wide block">Today's Special Access Price:</span>
                    <span className="text-2xl sm:text-3xl font-black text-slate-950">$0.00 (100% FREE)</span>
                  </div>
                  <span className="px-3 py-1 bg-amber-500 text-slate-950 font-black text-xs rounded-full uppercase">Instant Access</span>
                </div>
              </div>
            </div>

            <LeadCaptureForm onSuccess={onSuccess} />
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="bg-slate-950 text-slate-400 py-10 border-t border-slate-800 text-xs">
          <div className="max-w-6xl mx-auto px-4 text-center space-y-3">
            <p className="text-slate-200 font-bold text-sm">Gospel & Jazz Piano Mastery — Novice Path with Daniel Ubachi</p>
            <p className="text-slate-500 max-w-2xl mx-auto text-[11px] leading-relaxed">
              This site is not part of the Facebook website or Meta Inc. Additionally, this site is NOT endorsed by Facebook in any way. FACEBOOK is a trademark of META, Inc.
            </p>
            <p className="text-slate-600 text-[10px]">
              © {new Date().getFullYear()} Daniel Ubachi Piano Academy. All Rights Reserved.
            </p>
          </div>
        </footer>
      );
    }

    function SuccessModal({ isOpen, onClose, lead }) {
      if (!isOpen || !lead) return null;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 sm:p-8 text-center animate-scale-in border border-slate-200">
            <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl font-black">
              ✓
            </div>
            <h3 className="text-2xl font-black text-slate-900 mb-2">Congratulations, {lead.name}!</h3>
            <p className="text-sm text-slate-600 mb-6 leading-relaxed">
              Your free masterclass access has been registered for <strong className="text-slate-900">{lead.email}</strong>.
            </p>

            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-left text-xs space-y-2 mb-6">
              <p className="font-bold text-slate-800">Your Next 3 Immediate Steps:</p>
              <div className="flex items-start gap-2">
                <span className="text-amber-500 font-bold">1.</span>
                <span>Watch the masterclass video training now on this page.</span>
              </div>
              <div className="flex items-start gap-2">
                <span className="text-amber-500 font-bold">2.</span>
                <span>Download your Novice Practice Checklist below.</span>
              </div>
              <div className="flex items-start gap-2">
                <span className="text-amber-500 font-bold">3.</span>
                <span>Practice 1 short 15-minute lesson today at your piano.</span>
              </div>
            </div>

            <div className="space-y-3">
              <button
                type="button"
                onClick={() => {
                  const blob = new Blob([
                    `GOSPEL & JAZZ PIANO MASTERY - NOVICE FOUNDATIONS CHECKLIST\nStudent: ${lead.name}\nPhone: ${lead.phone || 'N/A'}\nEmail: ${lead.email}\n\nLESSON CHECKLIST:\n[ ] Lesson 1: Black and White Key Pattern (Name any note in seconds)\n[ ] Lesson 2: Sharps & Flats One-Step Rule\n[ ] Lesson 3: Half-Step / Whole-Step Master Secret\n[ ] Lesson 4: Major Scale Formula (W-W-H-W-W-W-H)\n[ ] Lesson 5: 4 + 3 Major Triad Formula (Instant Church Chords)\n[ ] Lesson 6: The Tonic "Home Note" Resolution Secret\n[ ] Lesson 7: Root, 1st & 2nd Inversions\n[ ] Lesson 8: Soulful Gospel Melodies in Service\n\nDaily Practice Rule: 1 Short Lesson + 1 Focused Hour.\nGod Bless Your Musical Calling!`
                  ], { type: 'text/plain;charset=utf-8' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `Novice_Piano_Checklist_${lead.name.replace(/\s+/g, '_')}.txt`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  setTimeout(() => URL.revokeObjectURL(url), 1000);
                }}
                className="w-full py-3 px-4 bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black uppercase tracking-wider rounded-xl shadow-md transition-colors cursor-pointer"
              >
                Download Practice Checklist (.txt)
              </button>

              <button
                type="button"
                onClick={onClose}
                className="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition-colors cursor-pointer"
              >
                Continue to Training
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [submittedLead, setSubmittedLead] = useState(null);
      const [isSuccessOpen, setIsSuccessOpen] = useState(false);

      const handleSuccess = (lead) => {
        setSubmittedLead(lead);
        setIsSuccessOpen(true);
      };

      return (
        <div className="min-h-screen flex flex-col bg-white">
          <UrgencyHeader />
          <HeroSection onSuccess={handleSuccess} />
          <TestimonialsRow />
          <CurriculumMastery />
          <ValueStackSection onSuccess={handleSuccess} />
          <Footer />
          <SuccessModal
            isOpen={isSuccessOpen}
            onClose={() => setIsSuccessOpen(false)}
            lead={submittedLead}
          />
        </div>
      );
    }

    // Mount Application
    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>
</html>
